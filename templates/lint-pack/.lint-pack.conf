# Example config for lint-pack.sh. Copy this file to the root of your repository
# as .lint-pack.conf, commit it, and turn on the checks you want.
#
# The script reads this file from the HEAD commit, never from the work tree, and
# only as data: one key=value per line, no shell, no quoting. A blank line or a
# line that starts with # is skipped. A repeated key adds one more item to its
# list. Keys that take one value (the *.enabled keys, stale.min-length,
# size.match) may appear once. An unknown key or a malformed line stops the run
# with LINT_PACK: error bad-config <line>.
#
# A glob is a shell glob in which * also matches /, for example docs/* or *.md.
# A pattern is a POSIX extended regular expression. \d, \w, \s, \b and
# back-references are rejected; use [0-9], [A-Za-z0-9_] and [[:space:]].

# ---- Check 1: stale symbols ----
# A symbol that the branch removed from the source globs, that is on no added
# line and in no tracked file outside the doc and help globs, but that a doc or
# help line at HEAD still names. Each such line is a record.

# Off until you set it to true. Needs stale.source and stale.symbol.
stale.enabled=false
# Files whose removed lines supply symbols.
stale.source=src/*
# Files that must not name a removed symbol. The default is *.md.
stale.doc=*.md
# Help-only files that must not name one (a usage text, a man page).
# stale.help=help/*.txt
# Each pattern pulls symbols out of the removed lines.
stale.symbol=--[a-z][a-z0-9-]+
stale.symbol=[A-Za-z_][A-Za-z0-9_]*
# Shorter symbols are dropped. A whole number from 1 to 64.
stale.min-length=6
# Paths whose hits are expected, such as a changelog that tells the history.
# stale.allow=CHANGELOG.md

# ---- Check 2: plan IDs and tombstones ----
# Each pattern matches as a whole word on an added line. The id before the first
# space names the pattern in the record: 1 to 32 of a-z, 0-9 and -.

# Off until you set it to true. Needs at least one ids.pattern.
ids.enabled=false
ids.pattern=tp TP-[0-9]+
ids.pattern=ac AC-[0-9]+
ids.pattern=adr ADR-[0-9]+
ids.pattern=pf PF-[0-9]+
ids.pattern=no-longer [Nn]o longer
ids.pattern=previously [Pp]reviously
# Paths where such text is fine.
ids.allow=CHANGELOG.md

# ---- Check 3: function size ----
# Runs your linter on the work tree from the repository root and keeps only the
# "<path>:<line>:" diagnostics that fall inside the lines the branch added.

# Off until you set it to true. Needs at least one size.arg.
size.enabled=false
# The command, one word per line. It is run as argv, never through a shell.
# ESLint (version 9 needs eslint-formatter-unix for the unix format):
size.arg=npx
size.arg=eslint
size.arg=--format
size.arg=unix
# Clippy instead (set too-many-lines-threshold in clippy.toml):
#   size.arg=cargo
#   size.arg=clippy
#   size.arg=--message-format
#   size.arg=short
#   size.arg=--
#   size.arg=-A
#   size.arg=clippy::all
#   size.arg=-W
#   size.arg=clippy::too_many_lines
#   size.match=too many lines
# A diagnostic line must match this pattern to count.
size.match=max-lines-per-function
# Exit statuses that are not an error. The default is 0 and 1. Repeat to add.
# size.ok-exit=2
# Paths whose diagnostics are expected.
# size.allow=src/generated/*
