name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:integration

  # The hooks ship to macOS, whose /bin/bash is 3.2 — no associative arrays, no
  # `${var,,}`, no `mapfile`. Ubuntu's bash 5 cannot catch a 4.x-only construct,
  # so this job runs the shell-hook suites and the installed-hook matrix with
  # /bin/bash first on PATH, and refuses to run anything under any other bash.
  macos-bash32-hooks:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Put /bin/bash (3.2) first on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -s /bin/bash "$RUNNER_TEMP/bash32/bash"
          echo "$RUNNER_TEMP/bash32" >> "$GITHUB_PATH"
      - name: Require bash 3.2
        run: |
          command -v bash
          first="$(bash --version | sed -n 1p)"
          echo "$first"
          case "$first" in
            *"version 3.2."*) ;;
            *) echo "::error::bash on PATH is not 3.2: $first"; exit 1 ;;
          esac
      - run: npm ci
      - run: npm run build
      - name: Shell-hook suites and hook matrix under bash 3.2
        run: |
          # tests/install-snapshot.test.ts carries the installed-hook matrix.
          suites="tests/shell-hooks.test.ts tests/shell-hooks-helpers.test.ts tests/shell-hooks-tracker.test.ts tests/capture-hooks.test.ts tests/queue-append.test.ts tests/install-snapshot.test.ts"
          # One file at a time: these suites spawn hundreds of hook processes, and in
          # parallel on a 3-core runner the load alone times tests out (5 s default).
          npx vitest run --no-file-parallelism $suites

  # TEMPORARY (#383 AC-3): proves the MDS 0.4.4 compile of this branch is
  # byte-identical to origin/main's MDS 0.2.0 compile on Linux, under both the
  # native and the WASM backend. Removed before merge.
  tmp-mds-byte-identity:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: head
      - uses: actions/checkout@v7
        with:
          ref: main
          path: base
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Baseline — origin/main build:mds (A)
        working-directory: base
        run: |
          git log -1 --format='main %H'
          npm ci
          npm ls @mdscript/mds
          npm run build:mds
          mkdir -p /tmp/A/skills/git
          cp -R dist/commands dist/agents /tmp/A/
          cp -R dist/skills/git/references /tmp/A/skills/git/
      - name: PR head build:mds, native backend (B-native)
        working-directory: head
        env:
          MDS_BACKEND: native
        run: |
          git log -1 --format='head %H'
          npm ci
          npm ls @mdscript/mds
          node --input-type=module -e "import {init,getBackend} from '@mdscript/mds'; await init(); const b=getBackend(); console.log('backend', b); if (b !== 'native') process.exit(1)"
          rm -rf dist
          npm run build:mds
          mkdir -p /tmp/B-native/skills/git
          cp -R dist/commands dist/agents /tmp/B-native/
          cp -R dist/skills/git/references /tmp/B-native/skills/git/
      - name: PR head build:mds, WASM backend (B-wasm)
        working-directory: head
        env:
          MDS_BACKEND: wasm
        run: |
          node --input-type=module -e "import {init,getBackend} from '@mdscript/mds'; await init(); const b=getBackend(); console.log('backend', b); if (b !== 'wasm') process.exit(1)"
          rm -rf dist
          npm run build:mds
          mkdir -p /tmp/B-wasm/skills/git
          cp -R dist/commands dist/agents /tmp/B-wasm/
          cp -R dist/skills/git/references /tmp/B-wasm/skills/git/
      - name: Compare trees
        run: |
          for t in A B-native B-wasm; do
            n=$(find /tmp/$t -type f | wc -l)
            d=$(cd /tmp/$t && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
            echo "tree $t files=$n manifest-sha256=$d"
          done
          for t in commands agents skills/git/references; do
            echo "per-dir $t A=$(find /tmp/A/$t -type f | wc -l) native=$(find /tmp/B-native/$t -type f | wc -l) wasm=$(find /tmp/B-wasm/$t -type f | wc -l)"
          done
          rc=0
          if diff -r /tmp/A /tmp/B-native; then echo "DIFF A vs B-native: EMPTY"; else echo "DIFF A vs B-native: NON-EMPTY"; rc=1; fi
          if diff -r /tmp/A /tmp/B-wasm; then echo "DIFF A vs B-wasm: EMPTY"; else echo "DIFF A vs B-wasm: NON-EMPTY"; rc=1; fi
          exit $rc
