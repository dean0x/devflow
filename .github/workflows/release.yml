name: Release

# A release PR sets the version in package.json, package-lock.json and
# CHANGELOG.md (scripts/bump-version.ts). After it merges, a `vX.Y.Z` tag push
# on the merged commit starts this workflow. See docs/reference/release-process.md.
on:
  push:
    tags:
      - "v*"

# Each job sets only the permissions it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the release commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The full history, so the main check below can see origin/main.
          fetch-depth: 0

      # No registry-url and no npm cache in this workflow.
      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # No npm cache, also when package.json names a package manager.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify the tag format
        run: |
          if ! printf '%s\n' "${GITHUB_REF_NAME}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$'; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not vX.Y.Z or vX.Y.Z-pre.N"
            exit 1
          fi

      - name: Verify the tag is on main
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points to a commit that is not on main"
            exit 1
          fi

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Verify package-lock.json version matches package.json
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          LOCK_VERSION="$(node -p "require('./package-lock.json').version")"
          LOCK_PKG_VERSION="$(node -p "require('./package-lock.json').packages[''].version")"
          if [ "${LOCK_VERSION}" != "${PKG_VERSION}" ] || [ "${LOCK_PKG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error::package-lock.json (${LOCK_VERSION}, ${LOCK_PKG_VERSION}) does not match package.json ${PKG_VERSION}. Run: npm install --package-lock-only"
            exit 1
          fi

      - name: Verify CHANGELOG.md has the version section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -qF "## [${VERSION}] - " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no \"## [${VERSION}] - <date>\" section"
            exit 1
          fi

      # The github-release job runs this same extraction after the publish.
      # It fails here first, for example on a non-empty [Unreleased] section.
      - name: Verify the release notes extract with no file change
        run: |
          npx tsx scripts/bump-version.ts "${GITHUB_REF_NAME#v}" > "${RUNNER_TEMP}/release-notes.md"
          git diff --exit-code

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Integration test
        run: npm run test:integration

      - name: Verify CLI version output
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ACTUAL="$(node dist/cli.js --version)"
          if [ "${ACTUAL}" != "${VERSION}" ]; then
            echo "::error::CLI reports ${ACTUAL}, expected ${VERSION}"
            exit 1
          fi

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No registry-url: setup-node then writes no npm token line to .npmrc.
      # No npm cache: this job can sign in to npm, so it restores no cached files.
      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # No npm cache, also when package.json names a package manager.
          package-manager-cache: false

      # This job can sign in to npm, so no dependency runs an install script here.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      # A release version publishes to `latest`. A pre-release version publishes
      # to its first pre-release word: 2.0.0-beta.1 goes to `beta`.
      - name: Select the npm dist-tag
        id: dist-tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "${VERSION}" in
            *-*)
              PRE="${VERSION#*-}"
              PRE="${PRE%%.*}"
              # npm refuses a dist-tag that is a version range, such as `1`.
              # A pre-release never moves `latest`.
              if ! printf '%s\n' "${PRE}" | grep -qE '^[A-Za-z][0-9A-Za-z]*$' || [ "${PRE}" = latest ]; then
                PRE=next
              fi
              echo "tag=${PRE}" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "tag=latest" >> "${GITHUB_OUTPUT}"
              ;;
          esac

      # npm trusted publishing: npm signs in with the workflow identity (OIDC).
      # The job has no npm token, so the publish can not fall back to one.
      # tests/release-workflow.test.ts keeps all workflows token-free.
      # Trusted publishing needs npm 11.5.1 or newer, and Node 22 has npm 10,
      # so this step runs a pinned npm 11 through npx. The publish runs the
      # prepublishOnly build.
      - name: Publish
        env:
          NPM_DIST_TAG: ${{ steps.dist-tag.outputs.tag }}
        run: npx -y npm@11.19.1 publish --provenance --access public --tag "${NPM_DIST_TAG}"

  github-release:
    name: Create the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # No npm cache, also when package.json names a package manager.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # On a version that the release PR set, bump-version.ts changes no file
      # and prints the release notes of that version.
      - name: Extract the release notes
        run: |
          npx tsx scripts/bump-version.ts "${GITHUB_REF_NAME#v}" > "${RUNNER_TEMP}/release-notes.md"
          git diff --exit-code

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          PRERELEASE_FLAG=""
          case "${GITHUB_REF_NAME}" in
            *-*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            ${PRERELEASE_FLAG}
